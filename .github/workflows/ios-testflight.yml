# Trigger from GitHub on iPad: Actions → iOS TestFlight → Run workflow
name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        default: production
        type: choice
        options:
          - production
          - preview
      submit:
        description: "Submit to TestFlight after build"
        required: true
        default: true
        type: boolean

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Expo / EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo auth
        run: eas whoami

      - name: Write App Store Connect API key (optional)
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "${APPLE_API_KEY_P8:-}" ]; then
            printf '%s\n' "$APPLE_API_KEY_P8" > asc-api-key.p8
            echo "EXPO_ASC_API_KEY_PATH=$PWD/asc-api-key.p8" >> "$GITHUB_ENV"
            echo "ASC API key file written"
          else
            echo "No APPLE_API_KEY_P8 secret — submit will use Expo-stored Apple credentials if configured"
          fi

      - name: Build iOS
        env:
          EXPO_ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          PROFILE="${{ inputs.profile }}"
          # Build alone does NOT put the app in TestFlight — --auto-submit uploads to ASC.
          if [ "${{ inputs.submit }}" = "true" ]; then
            eas build --platform ios --profile "$PROFILE" --non-interactive --auto-submit
          else
            eas build --platform ios --profile "$PROFILE" --non-interactive
            echo "::warning::Built without submit. IPA is on Expo only. Run Submit in Expo or re-run with submit=true."
          fi

      - name: Reminder
        if: ${{ inputs.submit == true }}
        run: |
          echo "After auto-submit, open App Store Connect → Activity (Processing), then TestFlight."
          echo "Check Apple ID email for ITMS rejection messages if the build never appears."
