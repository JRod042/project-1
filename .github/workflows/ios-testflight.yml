# iPhone App Store Connect + Android Play production. Trigger: Actions → Casa Rústico store.
name: Casa Rústico store

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        default: production
        type: choice
        options:
          - production
          - preview
      submit:
        description: "Submit after build (iOS → App Store Connect, Android → Play production)"
        required: true
        default: true
        type: boolean
      submit_only:
        description: "Skip build; submit the latest production binaries to the stores"
        required: false
        default: false
        type: boolean

concurrency:
  group: casa-store-${{ github.event.inputs.profile }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Expo / EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo auth
        run: eas whoami

      - name: Write App Store Connect API key (optional)
        if: matrix.platform == 'ios'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "${APPLE_API_KEY_P8:-}" ]; then
            printf '%s\n' "$APPLE_API_KEY_P8" > asc-api-key.p8
            echo "EXPO_ASC_API_KEY_PATH=$PWD/asc-api-key.p8" >> "$GITHUB_ENV"
            echo "ASC API key file written"
          else
            echo "No APPLE_API_KEY_P8 secret — submit will use Expo-stored Apple credentials if configured"
          fi

      - name: Build
        if: ${{ inputs.submit_only != true }}
        env:
          EXPO_ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          PROFILE="${{ inputs.profile }}"
          PLATFORM="${{ matrix.platform }}"
          if [ "$PLATFORM" = "ios" ] && [ "${{ inputs.submit }}" = "true" ]; then
            eas build --platform ios --profile "$PROFILE" --non-interactive --auto-submit
          else
            eas build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive
          fi

      - name: Submit latest (no rebuild)
        if: ${{ inputs.submit_only == true }}
        env:
          EXPO_ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          eas submit --platform "${{ matrix.platform }}" --profile production --latest --non-interactive --no-wait

      - name: Try Android Play production submit
        if: ${{ matrix.platform == 'android' && inputs.submit == true && inputs.submit_only != true }}
        continue-on-error: true
        run: |
          eas submit --platform android --profile production --latest --non-interactive --no-wait
